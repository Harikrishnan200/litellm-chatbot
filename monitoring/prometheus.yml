global:
  scrape_interval: 10s

scrape_configs:
  - job_name: backend          # our app metrics: requests, cache, rate limit, fallback...
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: litellm          # gateway metrics: per-deployment failures, cooldowns
    metrics_path: /metrics/
    static_configs: [{targets: ["litellm:4000"]}]
