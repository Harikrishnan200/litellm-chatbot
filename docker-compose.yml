# Run everything with:  docker compose up --build
services:
  frontend:
    build:
      context: ./chatbot-frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_KEY: ${API_KEY}
    ports: ["3000:80"]
    depends_on: [backend]

  backend:
    build: ./chatbot-backend
    env_file: .env
    environment:  # inside Docker, other services are reached by service name
      REDIS_URL: redis://redis:6379/0
      LITELLM_URL: http://litellm:4000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [redis, litellm]

  litellm:  # the LLM gateway: routing, retries, fallbacks, LangSmith callback
    image: ghcr.io/berriai/litellm:v1.104.0   # pinned: auto-routing is version sensitive
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:  # only what the gateway needs (no REDIS_URL: LiteLLM must not touch our Redis)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    ports: ["4000:4000"]

  redis:  # cache + rate limit counters
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local demo only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
